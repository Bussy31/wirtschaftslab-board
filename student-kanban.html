<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanban-Board</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .header-logo { font-size: 1.4rem; }
        .header-title { font-size: 1rem; font-weight: 700; }
        .header-badge {
            font-family: monospace;
            font-size: 0.72rem;
            opacity: 0.4;
            letter-spacing: 0.06em;
            margin-left: auto;
        }

        /* ── Add-Form ── */
        .add-form {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 10px 12px;
            display: flex;
            gap: 6px;
            align-items: stretch;
            flex-shrink: 0;
        }
        .add-form input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 8px 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .add-form input:focus { border-color: #3b82f6; }
        .add-form input.autor { width: 110px; flex-shrink: 0; }
        .add-form input.text { flex: 1; min-width: 0; }
        .add-form select {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 8px 6px;
            color: #f1f5f9;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .add-form button {
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }
        .add-form button:active { transform: scale(0.96); }
        .add-form button:disabled { background: rgba(255,255,255,0.12); cursor: default; }

        /* ── Board ── */
        .board {
            flex: 1;
            display: flex;
            gap: 8px;
            padding: 10px;
            overflow: hidden;
            min-height: 0;
        }

        .spalte {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.07);
            overflow: hidden;
            min-width: 0;
            transition: background 0.15s, border-color 0.15s;
        }
        .spalte.drag-over {
            background: rgba(59,130,246,0.12);
            border-color: rgba(59,130,246,0.4);
        }

        .spalte-header {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .spalte-name {
            font-size: 0.82rem;
            font-weight: 700;
            opacity: 0.85;
        }
        .spalte-count {
            font-size: 0.7rem;
            opacity: 0.4;
            background: rgba(255,255,255,0.08);
            padding: 1px 7px;
            border-radius: 10px;
        }

        .karten-liste {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .karten-liste::-webkit-scrollbar { width: 3px; }
        .karten-liste::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .karte {
            border-radius: 7px;
            padding: 9px 10px;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.15s;
            cursor: grab;
            user-select: none;
        }
        .karte.dragging { opacity: 0.4; transform: scale(0.97); }
        .karte-autor {
            font-size: 0.65rem;
            font-weight: 700;
            opacity: 0.6;
            margin-bottom: 3px;
        }
        .karte-text {
            font-size: 0.85rem;
            line-height: 1.35;
            word-break: break-word;
            margin-bottom: 7px;
        }
        .karte-btns {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }
        .move-btn {
            border: none;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 0.72rem;
            cursor: pointer;
            font-family: inherit;
            background: rgba(0,0,0,0.2);
            transition: background 0.12s;
        }
        .move-btn:active { background: rgba(0,0,0,0.4); }

        .spalte-leer {
            text-align: center;
            opacity: 0.2;
            font-size: 0.78rem;
            padding: 20px 8px;
        }

        /* ── Status-Views ── */
        .center-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }
        .center-view .icon { font-size: 3rem; margin-bottom: 14px; }
        .center-view h2 { margin-bottom: 8px; }
        .center-view p { opacity: 0.55; font-size: 0.9rem; line-height: 1.5; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34,197,94,0.9);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="view-loading" class="center-view">
    <div class="icon">⏳</div>
    <h2>Verbinde...</h2>
</div>

<div id="view-error" class="center-view" style="display:none;">
    <div class="icon">❌</div>
    <h2>Session nicht gefunden</h2>
    <p>Diese Session ist nicht mehr aktiv oder der Link ist ungültig.<br>Bitte scanne den QR-Code erneut.</p>
</div>

<div id="view-ended" class="center-view" style="display:none;">
    <div class="icon">✅</div>
    <h2>Session beendet</h2>
    <p>Die Lehrkraft hat das Kanban-Board geschlossen.</p>
</div>

<div id="view-main" style="display:none; flex-direction:column; height:100dvh; overflow:hidden;">

    <div class="header">
        <div class="header-logo">📋</div>
        <div class="header-title">Kanban-Board</div>
        <div class="header-badge" id="session-badge"></div>
    </div>

    <div class="add-form">
        <input type="text" id="autor" class="autor" placeholder="Dein Name" maxlength="50" autocomplete="name">
        <input type="text" id="text" class="text" placeholder="Neue Karte..." maxlength="300">
        <select id="spalte-select"></select>
        <button id="add-btn" onclick="karteHinzufuegen()">+</button>
    </div>

    <div class="board" id="board"></div>

</div>

<div class="toast" id="toast"></div>

<script>
    const FARBEN = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];

    const params = new URLSearchParams(window.location.search);
    const session = (params.get('session') || '').toUpperCase();

    let ws = null;
    let connected = false;
    let board = { columns: ['Aufgabe', 'In Bearbeitung', 'Erledigt'], cards: [] };
    let dragCardId = null;
    let myFarbe = FARBEN[Math.floor(Math.random() * FARBEN.length)];

    // Name aus localStorage
    const savedName = localStorage.getItem('kanban_autor');
    if (savedName) document.getElementById('autor').value = savedName;

    function show(id) {
        ['view-loading','view-error','view-ended','view-main'].forEach(v => {
            const el = document.getElementById(v);
            if (v === id) {
                el.style.display = v === 'view-main' ? 'flex' : 'flex';
                el.style.flexDirection = v === 'view-main' ? 'column' : '';
            } else {
                el.style.display = 'none';
            }
        });
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2200);
    }

    function textfarbe(hex) {
        if (!hex || hex.length < 7) return '#ffffff';
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return (r*299 + g*587 + b*114) / 1000 > 128 ? '#1e293b' : '#ffffff';
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        const selectEl = document.getElementById('spalte-select');
        const prevSpalte = selectEl.value;

        // Spalten-Dropdown
        selectEl.innerHTML = '';
        board.columns.forEach(col => {
            const opt = document.createElement('option');
            opt.value = col;
            opt.textContent = col;
            if (col === prevSpalte) opt.selected = true;
            selectEl.appendChild(opt);
        });

        // Board rendern
        boardEl.innerHTML = '';
        board.columns.forEach(spalte => {
            const karten = board.cards.filter(k => k.spalte === spalte);

            const col = document.createElement('div');
            col.className = 'spalte';
            col.dataset.spalte = spalte;

            col.addEventListener('dragover', e => {
                e.preventDefault();
                col.classList.add('drag-over');
            });
            col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
            col.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drag-over');
                if (dragCardId) moveCard(dragCardId, spalte);
            });

            // Header
            const header = document.createElement('div');
            header.className = 'spalte-header';
            header.innerHTML = `<span class="spalte-name">${spalte}</span><span class="spalte-count">${karten.length}</span>`;
            col.appendChild(header);

            // Karten
            const liste = document.createElement('div');
            liste.className = 'karten-liste';

            if (karten.length === 0) {
                const leer = document.createElement('div');
                leer.className = 'spalte-leer';
                leer.textContent = 'Leer';
                liste.appendChild(leer);
            }

            karten.forEach(karte => {
                const card = document.createElement('div');
                card.className = 'karte';
                card.draggable = true;
                card.dataset.id = karte.id;
                card.style.background = karte.farbe;

                card.addEventListener('dragstart', () => {
                    dragCardId = karte.id;
                    setTimeout(() => card.classList.add('dragging'), 0);
                });
                card.addEventListener('dragend', () => {
                    dragCardId = null;
                    card.classList.remove('dragging');
                });

                // Touch: long-press to drag (handled via move buttons instead)
                const tf = textfarbe(karte.farbe);

                let html = '';
                if (karte.autor) html += `<div class="karte-autor" style="color:${tf}">${karte.autor}</div>`;
                html += `<div class="karte-text" style="color:${tf}">${karte.text}</div>`;
                html += `<div class="karte-btns">`;

                // Zurück-Button (nicht für erste Spalte)
                const spalteIdx = board.columns.indexOf(spalte);
                if (spalteIdx > 0) {
                    html += `<button class="move-btn" style="color:${tf}" data-id="${karte.id}" data-to="${board.columns[spalteIdx - 1]}">← ${board.columns[spalteIdx - 1]}</button>`;
                }
                if (spalteIdx < board.columns.length - 1) {
                    html += `<button class="move-btn" style="color:${tf}" data-id="${karte.id}" data-to="${board.columns[spalteIdx + 1]}">${board.columns[spalteIdx + 1]} →</button>`;
                }
                html += `</div>`;

                card.innerHTML = html;

                // Move-Button click handler
                card.querySelectorAll('.move-btn').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        moveCard(btn.dataset.id, btn.dataset.to);
                    });
                    btn.addEventListener('mousedown', e => e.stopPropagation());
                });

                liste.appendChild(card);
            });

            col.appendChild(liste);
            boardEl.appendChild(col);
        });
    }

    function moveCard(cardId, spalte) {
        const card = board.cards.find(c => c.id === cardId);
        if (!card || card.spalte === spalte) return;
        card.spalte = spalte;
        renderBoard();
        wsSend({ type: 'kanban_card_move', cardId, spalte });
        toast('Karte verschoben →');
    }

    function karteHinzufuegen() {
        const textEl = document.getElementById('text');
        const autorEl = document.getElementById('autor');
        const spalteEl = document.getElementById('spalte-select');
        const text = textEl.value.trim();
        if (!text) { textEl.focus(); return; }

        const autor = autorEl.value.trim();
        const spalte = spalteEl.value || board.columns[0];
        if (autor) localStorage.setItem('kanban_autor', autor);

        wsSend({ type: 'kanban_card_add', text, autor, farbe: myFarbe, spalte });
        textEl.value = '';
        toast('Karte hinzugefügt ✓');

        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        setTimeout(() => btn.disabled = false, 800);
    }

    function wsSend(data) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
    }

    // Enter zum Hinzufügen
    document.getElementById('text').addEventListener('keyup', e => {
        if (e.key === 'Enter') karteHinzufuegen();
    });

    if (!session) { show('view-error'); }
    else { connect(); }

    function connect() {
        const wsUrl = 'wss://' + window.location.hostname + '/ws';
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', role: 'student', sessionId: session }));
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            if (msg.type === 'joined') {
                connected = true;
                document.getElementById('session-badge').textContent = 'Session ' + session;
                if (msg.kanbanBoard) {
                    board = msg.kanbanBoard;
                }
                renderBoard();
                show('view-main');
            }

            if (msg.type === 'kanban_update') {
                board = msg.board;
                renderBoard();
            }

            if (msg.type === 'error') { show('view-error'); }
            if (msg.type === 'session_ended') { show('view-ended'); }
        };

        ws.onclose = () => {
            if (!connected) show('view-error');
            else show('view-ended');
        };
        ws.onerror = () => { if (!connected) show('view-error'); };
    }
</script>
</body>
</html>
