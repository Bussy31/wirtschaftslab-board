<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanban-Board</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .header-logo { font-size: 1.3rem; }
        .header-title { font-size: 0.95rem; font-weight: 700; }
        .header-badge {
            font-family: monospace;
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 0.06em;
            margin-left: auto;
        }

        .add-form {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 8px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .add-form input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 9px 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            -webkit-appearance: none;
        }
        .add-form input.autor { width: 130px; flex-shrink: 0; }
        .add-form input.text { flex: 1; min-width: 120px; }
        .add-form select {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 9px 6px;
            color: #f1f5f9;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-appearance: none;
        }
        .add-form .farben-row {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .add-form button.add-btn {
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .add-form button.add-btn:active { opacity: 0.75; }
        .add-form button.add-btn:disabled { background: rgba(255,255,255,0.12); cursor: default; }

        .color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .color-swatch.active {
            border-color: white;
            outline: 1px solid rgba(255,255,255,0.4);
            outline-offset: 1px;
        }

        .board {
            flex: 1;
            display: flex;
            gap: 8px;
            padding: 10px;
            overflow: visible;
            min-height: 0;
        }

        .spalte {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.10);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: visible;
            min-width: 0;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }
        .spalte.drag-over {
            background: rgba(59,130,246,0.07);
            border-color: rgba(59,130,246,0.35);
        }

        .spalte-header {
            padding: 10px 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 12px 12px 0 0;
            position: relative;
            z-index: 2;
        }
        .spalte-name {
            font-size: 0.88rem;
            font-weight: 800;
            opacity: 0.9;
            letter-spacing: 0.03em;
            text-align: center;
        }
        .spalte-count {
            position: absolute;
            right: 10px;
            font-size: 0.72rem;
            opacity: 0.4;
            background: rgba(255,255,255,0.1);
            padding: 1px 8px;
            border-radius: 10px;
        }

        .karten-canvas {
            flex: 1;
            position: relative;
            overflow: visible;
            min-height: 80px;
        }

        .karte {
            position: absolute;
            border-radius: 3px;
            box-shadow: 2px 5px 12px rgba(0,0,0,0.38);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            z-index: 1;
        }
        .karte.dragging {
            box-shadow: 6px 10px 24px rgba(0,0,0,0.55);
            z-index: 50;
        }

        .karte-tape {
            position: absolute;
            left: 50%;
            top: -8px;
            transform: translateX(-50%);
            width: 44px;
            height: 14px;
            background: rgba(255,255,255,0.25);
            border-left: 1px solid rgba(255,255,255,0.18);
            border-right: 1px solid rgba(255,255,255,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            cursor: grab;
            z-index: 5;
        }

        .karte-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 6px 8px 20px;
            cursor: grab;
        }
        .karte-body:active { cursor: grabbing; }

        .karte-autor {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.65;
        }
        .karte-text {
            font-size: 0.88rem;
            line-height: 1.35;
            word-break: break-word;
            font-weight: 500;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .karte-delete {
            position: absolute;
            top: 2px;
            right: 3px;
            background: rgba(0,0,0,0.15);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 1px 4px;
            font-size: 0.6rem;
            z-index: 6;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }

        .spalte-leer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0.2;
            font-size: 0.75rem;
            padding: 20px;
            pointer-events: none;
        }

        .center-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }
        .center-view .icon { font-size: 3rem; margin-bottom: 14px; }
        .center-view h2 { margin-bottom: 8px; }
        .center-view p { opacity: 0.55; font-size: 0.9rem; line-height: 1.5; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34,197,94,0.9);
            color: white;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="view-loading" class="center-view">
    <div class="icon">⏳</div>
    <h2>Verbinde...</h2>
</div>

<div id="view-error" class="center-view" style="display:none;">
    <div class="icon">❌</div>
    <h2>Session nicht gefunden</h2>
    <p>Diese Session ist nicht mehr aktiv oder der Link ist ungültig.<br>Bitte scanne den QR-Code erneut.</p>
</div>

<div id="view-ended" class="center-view" style="display:none;">
    <div class="icon">✅</div>
    <h2>Session beendet</h2>
    <p>Die Lehrkraft hat das Kanban-Board geschlossen.</p>
</div>

<div id="view-main" style="display:none; flex-direction:column; height:100dvh; overflow:hidden;">

    <div class="header">
        <div class="header-logo">📋</div>
        <div class="header-title">Kanban-Board</div>
        <div class="header-badge" id="session-badge"></div>
    </div>

    <div class="add-form">
        <input type="text" id="autor" class="autor" placeholder="Name (optional)" maxlength="50" autocomplete="name">
        <input type="text" id="text" class="text" placeholder="Neue Karte..." maxlength="300">
        <select id="spalte-select"></select>
        <div class="farben-row" id="farben-row"></div>
        <button class="add-btn" id="add-btn" onclick="karteHinzufuegen()">+</button>
    </div>

    <div class="board" id="board"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const FARBEN = ['#fbbf24','#f87171','#86efac','#93c5fd','#c4b5fd','#f9a8d4','#5eead4','#fdba74','#ffffff','#475569'];
    const CARD_W = 130, CARD_H = 130;

    const params = new URLSearchParams(window.location.search);
    const session = (params.get('session') || '').toUpperCase();

    let ws = null;
    let connected = false;
    let board = { columns: ['Aufgabe', 'In Bearbeitung', 'Erledigt'], cards: [] };
    let positions = {}; // cardId → {x, y}
    let selectedFarbe = '#fbbf24';
    let html5DragId = null;

    // Drag state (mouse + touch)
    let drag = { active: false, cardId: null, cardEl: null,
                 startX: 0, startY: 0, startCardX: 0, startCardY: 0 };

    // Name aus localStorage
    const savedName = localStorage.getItem('kanban_autor');
    if (savedName) document.getElementById('autor').value = savedName;

    // Farb-Picker aufbauen
    function buildColorPicker() {
        const row = document.getElementById('farben-row');
        row.innerHTML = '';
        FARBEN.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'color-swatch' + (f === selectedFarbe ? ' active' : '');
            btn.style.background = f;
            btn.style.border = f === selectedFarbe ? '2px solid white' : '2px solid transparent';
            btn.style.outline = f === selectedFarbe ? '1px solid rgba(255,255,255,0.4)' : 'none';
            btn.style.outlineOffset = '1px';
            btn.addEventListener('click', e => { e.preventDefault(); selectedFarbe = f; buildColorPicker(); });
            btn.addEventListener('touchend', e => { e.preventDefault(); selectedFarbe = f; buildColorPicker(); });
            row.appendChild(btn);
        });
    }
    buildColorPicker();

    function show(id) {
        ['view-loading','view-error','view-ended','view-main'].forEach(v => {
            const el = document.getElementById(v);
            el.style.display = v === id ? (v === 'view-main' ? 'flex' : 'flex') : 'none';
            if (v === id && v === 'view-main') el.style.flexDirection = 'column';
        });
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }

    function textfarbe(hex) {
        if (!hex || hex.length < 7) return '#1e293b';
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return (r*299 + g*587 + b*114) / 1000 > 128 ? '#1e293b' : '#ffffff';
    }

    function findSpalteAtPoint(clientX, clientY) {
        for (const el of document.querySelectorAll('.spalte')) {
            const rect = el.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right &&
                clientY >= rect.top && clientY <= rect.bottom) {
                return { spalte: el.dataset.spalte, el };
            }
        }
        return null;
    }

    function initPosition(cardId, spalte) {
        if (positions[cardId]) return;
        const inSpalte = board.cards.filter(c => c.spalte === spalte && !positions[c.id]);
        const idx = inSpalte.findIndex(c => c.id === cardId);
        positions[cardId] = {
            x: 10 + (idx < 0 ? 0 : idx % 2) * (CARD_W + 15),
            y: 20 + (idx < 0 ? 0 : Math.floor(idx / 2)) * (CARD_H + 15)
        };
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        const selectEl = document.getElementById('spalte-select');
        const prevSpalte = selectEl.value;

        selectEl.innerHTML = '';
        board.columns.forEach(col => {
            const opt = document.createElement('option');
            opt.value = col; opt.textContent = col;
            if (col === prevSpalte) opt.selected = true;
            selectEl.appendChild(opt);
        });

        boardEl.innerHTML = '';
        board.columns.forEach(spalte => {
            const karten = board.cards.filter(k => k.spalte === spalte);

            const col = document.createElement('div');
            col.className = 'spalte';
            col.dataset.spalte = spalte;

            // HTML5 drop (from tape strip)
            col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
            col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
            col.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drag-over');
                if (!html5DragId) return;
                const card = board.cards.find(c => c.id === html5DragId);
                if (card && card.spalte !== spalte) {
                    const canvas = col.querySelector('.karten-canvas');
                    if (canvas) {
                        const rect = canvas.getBoundingClientRect();
                        positions[card.id] = {
                            x: Math.max(0, e.clientX - rect.left - CARD_W / 2),
                            y: Math.max(20, e.clientY - rect.top - CARD_H / 2)
                        };
                    }
                    card.spalte = spalte;
                    wsSend({ type: 'kanban_card_move', cardId: card.id, spalte });
                    renderBoard();
                    toast('Karte verschoben');
                }
                html5DragId = null;
            });

            // Header
            const header = document.createElement('div');
            header.className = 'spalte-header';
            header.innerHTML = `<span class="spalte-name">${spalte}</span><span class="spalte-count">${karten.length}</span>`;
            col.appendChild(header);

            // Canvas
            const canvas = document.createElement('div');
            canvas.className = 'karten-canvas';

            if (karten.length === 0) {
                const leer = document.createElement('div');
                leer.className = 'spalte-leer';
                leer.textContent = 'Leer';
                canvas.appendChild(leer);
            }

            karten.forEach(karte => {
                initPosition(karte.id, spalte);
                const pos = positions[karte.id];
                const tf = textfarbe(karte.farbe);

                const cardEl = document.createElement('div');
                cardEl.className = 'karte';
                cardEl.dataset.id = karte.id;
                cardEl.style.cssText = `left:${pos.x}px; top:${pos.y}px; width:${CARD_W}px; height:${CARD_H}px; background:${karte.farbe};`;

                // Tape strip (HTML5 drag handle für Spaltenwechsel)
                const tape = document.createElement('div');
                tape.className = 'karte-tape';
                tape.draggable = true;
                tape.addEventListener('dragstart', e => { e.stopPropagation(); html5DragId = karte.id; });
                tape.addEventListener('dragend', () => html5DragId = null);
                cardEl.appendChild(tape);

                // Body (freies Verschieben)
                const body = document.createElement('div');
                body.className = 'karte-body';

                if (karte.autor) {
                    const a = document.createElement('div');
                    a.className = 'karte-autor';
                    a.style.color = tf;
                    a.textContent = karte.autor;
                    body.appendChild(a);
                }

                const t = document.createElement('div');
                t.className = 'karte-text';
                t.style.color = tf;
                t.textContent = karte.text;
                body.appendChild(t);
                cardEl.appendChild(body);

                // Delete button
                const del = document.createElement('button');
                del.className = 'karte-delete';
                del.textContent = '✕';
                del.style.color = tf;
                del.addEventListener('click', e => { e.stopPropagation(); karteLoeschen(karte.id); });
                del.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); karteLoeschen(karte.id); });
                cardEl.appendChild(del);

                // Mouse drag
                body.addEventListener('mousedown', e => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    dragStart(karte.id, e.clientX, e.clientY, cardEl);
                });

                // Touch drag
                body.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    dragStart(karte.id, t.clientX, t.clientY, cardEl);
                }, { passive: false });

                canvas.appendChild(cardEl);
            });

            col.appendChild(canvas);
            boardEl.appendChild(col);
        });
    }

    function dragStart(cardId, clientX, clientY, el) {
        drag.active = true;
        drag.cardId = cardId;
        drag.cardEl = el;
        drag.startX = clientX;
        drag.startY = clientY;
        drag.startCardX = positions[cardId] ? positions[cardId].x : 0;
        drag.startCardY = positions[cardId] ? positions[cardId].y : 0;
        el.classList.add('dragging');
    }

    function dragMove(clientX, clientY) {
        if (!drag.active || !drag.cardEl) return;
        const dx = clientX - drag.startX;
        const dy = clientY - drag.startY;
        drag.cardEl.style.left = (drag.startCardX + dx) + 'px';
        drag.cardEl.style.top = (drag.startCardY + dy) + 'px';
        // Column highlight
        const hit = findSpalteAtPoint(clientX, clientY);
        document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over'));
        if (hit) hit.el.classList.add('drag-over');
    }

    function dragEnd(clientX, clientY) {
        if (!drag.active) return;
        const dx = clientX - drag.startX;
        const dy = clientY - drag.startY;
        const newX = drag.startCardX + dx;
        const newY = drag.startCardY + dy;

        const card = board.cards.find(c => c.id === drag.cardId);
        if (card) {
            const hit = findSpalteAtPoint(clientX, clientY);
            const targetSpalte = hit ? hit.spalte : null;

            if (targetSpalte && targetSpalte !== card.spalte) {
                const canvas = hit.el.querySelector('.karten-canvas');
                if (canvas) {
                    const rect = canvas.getBoundingClientRect();
                    positions[card.id] = {
                        x: Math.max(0, clientX - rect.left - CARD_W / 2),
                        y: Math.max(20, clientY - rect.top - CARD_H / 2)
                    };
                }
                card.spalte = targetSpalte;
                wsSend({ type: 'kanban_card_move', cardId: card.id, spalte: targetSpalte });
                toast('Karte verschoben');
            } else {
                positions[card.id] = { x: newX, y: newY };
            }
        }

        drag.cardEl.classList.remove('dragging');
        document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over'));
        drag.active = false;
        drag.cardEl = null;
        renderBoard();
    }

    // Global mouse events
    document.addEventListener('mousemove', e => { if (drag.active) dragMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup', e => { if (drag.active) dragEnd(e.clientX, e.clientY); });

    // Global touch events
    document.addEventListener('touchmove', e => {
        if (!drag.active) return;
        e.preventDefault();
        dragMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchend', e => {
        if (!drag.active) return;
        dragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    });
    document.addEventListener('touchcancel', () => {
        if (!drag.active) return;
        drag.cardEl && drag.cardEl.classList.remove('dragging');
        document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over'));
        drag.active = false; drag.cardEl = null;
        renderBoard();
    });

    function karteHinzufuegen() {
        const textEl = document.getElementById('text');
        const autorEl = document.getElementById('autor');
        const spalteEl = document.getElementById('spalte-select');
        const text = textEl.value.trim();
        if (!text) { textEl.focus(); return; }

        const autor = autorEl.value.trim();
        const spalte = spalteEl.value || board.columns[0];
        if (autor) localStorage.setItem('kanban_autor', autor);

        wsSend({ type: 'kanban_card_add', text, autor, farbe: selectedFarbe, spalte });
        textEl.value = '';
        toast('Karte hinzugefügt ✓');

        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        setTimeout(() => btn.disabled = false, 800);
    }

    function karteLoeschen(cardId) {
        board.cards = board.cards.filter(c => c.id !== cardId);
        delete positions[cardId];
        renderBoard();
        wsSend({ type: 'kanban_card_delete', cardId });
        toast('Karte gelöscht');
    }

    function wsSend(data) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
    }

    document.getElementById('text').addEventListener('keyup', e => {
        if (e.key === 'Enter') karteHinzufuegen();
    });

    if (!session) { show('view-error'); }
    else { connect(); }

    function connect() {
        const wsUrl = 'wss://' + window.location.hostname + '/ws';
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', role: 'student', sessionId: session }));
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            if (msg.type === 'joined') {
                connected = true;
                document.getElementById('session-badge').textContent = 'Session ' + session;
                if (msg.kanbanBoard) board = msg.kanbanBoard;
                renderBoard();
                show('view-main');
            }

            if (msg.type === 'kanban_update') {
                const newCards = msg.board.cards;
                // Clean up positions for deleted cards
                const ids = new Set(newCards.map(c => c.id));
                Object.keys(positions).forEach(id => { if (!ids.has(id)) delete positions[id]; });
                board = msg.board;
                renderBoard();
            }

            if (msg.type === 'error') show('view-error');
            if (msg.type === 'session_ended') show('view-ended');
        };

        ws.onclose = () => { if (!connected) show('view-error'); else show('view-ended'); };
        ws.onerror = () => { if (!connected) show('view-error'); };
    }
</script>
</body>
</html>
