<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanban-Board</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .header-logo { font-size: 1.3rem; }
        .header-title { font-size: 0.95rem; font-weight: 700; }
        .header-badge { font-family: monospace; font-size: 0.7rem; opacity: 0.4; letter-spacing: 0.06em; margin-left: auto; }

        .add-form {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 8px 12px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .add-form input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 9px 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            -webkit-appearance: none;
        }
        .add-form input.autor { width: 130px; flex-shrink: 0; }
        .add-form input.text { flex: 1; min-width: 120px; }
        .add-form select {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 9px 6px;
            color: #f1f5f9;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-appearance: none;
        }
        .farben-row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .color-swatch {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid transparent; cursor: pointer; padding: 0; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .color-swatch.active { border-color: white; outline: 1px solid rgba(255,255,255,0.4); outline-offset: 1px; }
        .add-btn {
            background: #3b82f6; border: none; color: white;
            border-radius: 8px; padding: 9px 18px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            font-family: inherit; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .add-btn:active { opacity: 0.75; }
        .add-btn:disabled { background: rgba(255,255,255,0.12); cursor: default; }

        .board {
            flex: 1;
            display: flex;
            gap: 8px;
            padding: 10px;
            overflow: visible;
            min-height: 0;
        }

        .spalte {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.10);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: visible;
            min-width: 0;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }
        .spalte.drag-over {
            background: rgba(59,130,246,0.13);
            border-color: rgba(59,130,246,0.45);
        }
        .spalte.drag-target {
            background: rgba(59,130,246,0.05);
            border-color: rgba(59,130,246,0.2);
        }

        .spalte-header {
            padding: 10px 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 12px 12px 0 0;
            position: relative; z-index: 2;
        }
        .spalte-name { font-size: 0.88rem; font-weight: 800; opacity: 0.9; letter-spacing: 0.03em; text-align: center; }
        .spalte-count {
            position: absolute; right: 10px;
            font-size: 0.72rem; opacity: 0.4;
            background: rgba(255,255,255,0.1); padding: 1px 8px; border-radius: 10px;
        }

        .karten-outer {
            flex: 1;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .karten-outer::-webkit-scrollbar { width: 3px; height: 3px; }
        .karten-outer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .karten-canvas {
            position: relative;
            min-width: 300px;
            min-height: 500px;
        }

        .karte {
            position: absolute;
            border-radius: 3px;
            box-shadow: 2px 5px 12px rgba(0,0,0,0.38);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            z-index: 1;
            transition: box-shadow 0.2s;
        }
        .karte.dragging {
            box-shadow: 6px 10px 24px rgba(0,0,0,0.55) !important;
            z-index: 50;
            transition: none;
        }
        .karte-tape {
            position: absolute; left: 50%; top: -8px;
            transform: translateX(-50%);
            width: 44px; height: 14px;
            background: rgba(255,255,255,0.25);
            border-left: 1px solid rgba(255,255,255,0.18);
            border-right: 1px solid rgba(255,255,255,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            cursor: grab; z-index: 5;
        }
        .karte-body {
            flex: 1; display: flex; flex-direction: column; gap: 3px;
            padding: 6px 8px 20px; cursor: grab;
        }
        .karte-autor { font-size: 0.68rem; font-weight: 700; opacity: 0.65; }
        .karte-text {
            font-size: 0.88rem; line-height: 1.35; word-break: break-word;
            font-weight: 500; flex: 1;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .karte-delete {
            position: absolute; top: 2px; right: 3px;
            background: rgba(0,0,0,0.15); border: none;
            border-radius: 4px; cursor: pointer;
            padding: 1px 4px; font-size: 0.6rem;
            z-index: 6; line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        .spalte-leer {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            text-align: center; opacity: 0.2; font-size: 0.75rem;
            padding: 20px; pointer-events: none;
        }

        .center-view {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 30px 20px;
        }
        .center-view .icon { font-size: 3rem; margin-bottom: 14px; }
        .center-view h2 { margin-bottom: 8px; }
        .center-view p { opacity: 0.55; font-size: 0.9rem; line-height: 1.5; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(34,197,94,0.9); color: white;
            padding: 9px 20px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600;
            z-index: 200; opacity: 0; transition: opacity 0.25s;
            pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="view-loading" class="center-view">
    <div class="icon">⏳</div>
    <h2>Verbinde...</h2>
</div>
<div id="view-error" class="center-view" style="display:none;">
    <div class="icon">❌</div>
    <h2>Session nicht gefunden</h2>
    <p>Diese Session ist nicht mehr aktiv oder der Link ist ungültig.<br>Bitte scanne den QR-Code erneut.</p>
</div>
<div id="view-ended" class="center-view" style="display:none;">
    <div class="icon">✅</div>
    <h2>Session beendet</h2>
    <p>Die Lehrkraft hat das Kanban-Board geschlossen.</p>
</div>

<div id="view-main" style="display:none; flex-direction:column; height:100dvh; overflow:hidden;">
    <div class="header">
        <div class="header-logo">📋</div>
        <div class="header-title">Kanban-Board</div>
        <div class="header-badge" id="session-badge"></div>
    </div>
    <div class="add-form">
        <input type="text" id="autor" class="autor" placeholder="Name (optional)" maxlength="50" autocomplete="name">
        <input type="text" id="text" class="text" placeholder="Neue Karte..." maxlength="300">
        <select id="spalte-select"></select>
        <div class="farben-row" id="farben-row"></div>
        <button class="add-btn" id="add-btn" onclick="karteHinzufuegen()">+</button>
    </div>
    <div class="board" id="board"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const FARBEN = ['#fbbf24','#f87171','#86efac','#93c5fd','#c4b5fd','#f9a8d4','#5eead4','#fdba74','#ffffff','#475569'];
    const CARD_W = 130, CARD_H = 130;

    const params = new URLSearchParams(window.location.search);
    const session = (params.get('session') || '').toUpperCase();

    let ws = null, connected = false;
    let board = { columns: ['Aufgabe', 'In Bearbeitung', 'Erledigt'], cards: [] };
    let positions = {};
    let selectedFarbe = '#fbbf24';
    let html5DragId = null;
    let dragSourceSpalte = null;

    let drag = { active: false, cardId: null, cardEl: null,
                 startX: 0, startY: 0,
                 startClientX: 0, startClientY: 0,
                 startCardX: 0, startCardY: 0 };

    const savedName = localStorage.getItem('kanban_autor');
    if (savedName) document.getElementById('autor').value = savedName;

    function buildColorPicker() {
        const row = document.getElementById('farben-row');
        row.innerHTML = '';
        FARBEN.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'color-swatch' + (f === selectedFarbe ? ' active' : '');
            btn.style.background = f;
            btn.addEventListener('click', e => { e.preventDefault(); selectedFarbe = f; buildColorPicker(); });
            btn.addEventListener('touchend', e => { e.preventDefault(); selectedFarbe = f; buildColorPicker(); });
            row.appendChild(btn);
        });
    }
    buildColorPicker();

    function show(id) {
        ['view-loading','view-error','view-ended','view-main'].forEach(v => {
            const el = document.getElementById(v);
            el.style.display = 'none';
        });
        const target = document.getElementById(id);
        target.style.display = 'flex';
        if (id === 'view-main') target.style.flexDirection = 'column';
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }

    function textfarbe(hex) {
        if (!hex || hex.length < 7) return '#1e293b';
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return (r*299 + g*587 + b*114) / 1000 > 128 ? '#1e293b' : '#ffffff';
    }

    function findSpalteAtPoint(clientX, clientY) {
        for (const el of document.querySelectorAll('.spalte')) {
            const rect = el.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right &&
                clientY >= rect.top && clientY <= rect.bottom) {
                return { spalte: el.dataset.spalte, el };
            }
        }
        return null;
    }

    function updateHighlights(activeSpalte) {
        document.querySelectorAll('.spalte').forEach(el => {
            el.classList.remove('drag-over', 'drag-target');
            if (!drag.active && !html5DragId) return;
            const s = el.dataset.spalte;
            if (s === activeSpalte) el.classList.add('drag-over');
            else if (s !== dragSourceSpalte) el.classList.add('drag-target');
        });
    }

    function initPosition(cardId, spalte) {
        if (positions[cardId]) return;
        const inSpalte = board.cards.filter(c => c.spalte === spalte);
        const idx = inSpalte.findIndex(c => c.id === cardId);
        const i = idx < 0 ? 0 : idx;
        positions[cardId] = {
            x: 10 + (i % 2) * (CARD_W + 15),
            y: 20 + Math.floor(i / 2) * (CARD_H + 15)
        };
    }

    function canvasMinSize(spalte) {
        const karten = board.cards.filter(k => k.spalte === spalte);
        const maxX = karten.reduce((m, k) => {
            const p = positions[k.id];
            return p ? Math.max(m, p.x + CARD_W + 20) : m;
        }, 300);
        const maxY = karten.reduce((m, k) => {
            const p = positions[k.id];
            return p ? Math.max(m, p.y + CARD_H + 20) : m;
        }, 500);
        return { width: maxX, height: maxY };
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        const selectEl = document.getElementById('spalte-select');
        const prevSpalte = selectEl.value;

        selectEl.innerHTML = '';
        board.columns.forEach(col => {
            const opt = document.createElement('option');
            opt.value = col; opt.textContent = col;
            if (col === prevSpalte) opt.selected = true;
            selectEl.appendChild(opt);
        });

        boardEl.innerHTML = '';
        board.columns.forEach(spalte => {
            const karten = board.cards.filter(k => k.spalte === spalte);

            const col = document.createElement('div');
            col.className = 'spalte';
            col.dataset.spalte = spalte;

            // HTML5 drop (Tesa-Streifen)
            col.addEventListener('dragover', e => {
                e.preventDefault();
                updateHighlights(spalte);
            });
            col.addEventListener('dragleave', () => updateHighlights(null));
            col.addEventListener('drop', e => {
                e.preventDefault();
                if (!html5DragId) return;
                const card = board.cards.find(c => c.id === html5DragId);
                if (card && card.spalte !== spalte) {
                    const canvas = col.querySelector('.karten-canvas');
                    if (canvas) {
                        const rect = canvas.getBoundingClientRect();
                        positions[card.id] = {
                            x: Math.max(0, e.clientX - rect.left - CARD_W / 2),
                            y: Math.max(20, e.clientY - rect.top - CARD_H / 2)
                        };
                    }
                    card.spalte = spalte;
                    wsSend({ type: 'kanban_card_move', cardId: card.id, spalte });
                    toast('Karte verschoben');
                }
                html5DragId = null;
                dragSourceSpalte = null;
                document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over', 'drag-target'));
                renderBoard();
            });

            // Header
            const header = document.createElement('div');
            header.className = 'spalte-header';
            header.innerHTML = `<span class="spalte-name">${spalte}</span><span class="spalte-count">${karten.length}</span>`;
            col.appendChild(header);

            // Outer scroll
            const outer = document.createElement('div');
            outer.className = 'karten-outer';

            // Inner canvas
            const canvas = document.createElement('div');
            canvas.className = 'karten-canvas';
            const size = canvasMinSize(spalte);
            canvas.style.minWidth = size.width + 'px';
            canvas.style.minHeight = size.height + 'px';

            if (karten.length === 0) {
                const leer = document.createElement('div');
                leer.className = 'spalte-leer';
                leer.textContent = 'Leer';
                canvas.appendChild(leer);
            }

            karten.forEach(karte => {
                initPosition(karte.id, spalte);
                const pos = positions[karte.id];
                const tf = textfarbe(karte.farbe);

                const cardEl = document.createElement('div');
                cardEl.className = 'karte';
                cardEl.dataset.id = karte.id;
                cardEl.style.cssText = `left:${pos.x}px; top:${pos.y}px; width:${CARD_W}px; height:${CARD_H}px; background:${karte.farbe};`;

                // Tesa-Streifen (HTML5-Drag-Handle)
                const tape = document.createElement('div');
                tape.className = 'karte-tape';
                tape.draggable = true;
                tape.addEventListener('dragstart', e => {
                    e.stopPropagation();
                    html5DragId = karte.id;
                    dragSourceSpalte = karte.spalte;
                    updateHighlights(null);
                });
                tape.addEventListener('dragend', () => {
                    html5DragId = null;
                    dragSourceSpalte = null;
                    document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over', 'drag-target'));
                });
                cardEl.appendChild(tape);

                // Body
                const body = document.createElement('div');
                body.className = 'karte-body';

                if (karte.autor) {
                    const a = document.createElement('div');
                    a.className = 'karte-autor';
                    a.style.color = tf;
                    a.textContent = karte.autor;
                    body.appendChild(a);
                }

                const t = document.createElement('div');
                t.className = 'karte-text';
                t.style.color = tf;
                t.textContent = karte.text;
                body.appendChild(t);
                cardEl.appendChild(body);

                // Delete
                const del = document.createElement('button');
                del.className = 'karte-delete';
                del.textContent = '✕';
                del.style.color = tf;
                del.addEventListener('click', e => { e.stopPropagation(); karteLoeschen(karte.id); });
                del.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); karteLoeschen(karte.id); });
                cardEl.appendChild(del);

                // Mouse drag
                body.addEventListener('mousedown', e => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    dragStart(karte.id, karte.spalte, e.clientX, e.clientY, cardEl, canvas);
                });
                // Touch drag
                body.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    dragStart(karte.id, karte.spalte, t.clientX, t.clientY, cardEl, canvas);
                }, { passive: false });

                canvas.appendChild(cardEl);
            });

            outer.appendChild(canvas);
            col.appendChild(outer);
            boardEl.appendChild(col);
        });
    }

    function dragStart(cardId, spalte, clientX, clientY, el, canvas) {
        const rect = el.getBoundingClientRect();
        // Karte aus Scroll-Container rausnehmen → kein Clipping beim Cross-Column-Drag
        el.style.position = 'fixed';
        el.style.left = rect.left + 'px';
        el.style.top = rect.top + 'px';
        el.style.width = rect.width + 'px';
        el.style.height = rect.height + 'px';
        document.body.appendChild(el);

        drag.active = true;
        drag.cardId = cardId;
        drag.cardEl = el;
        drag.startX = clientX;
        drag.startY = clientY;
        drag.startClientX = rect.left;
        drag.startClientY = rect.top;
        drag.startCardX = positions[cardId] ? positions[cardId].x : 0;
        drag.startCardY = positions[cardId] ? positions[cardId].y : 0;
        dragSourceSpalte = spalte;
        el.classList.add('dragging');
        updateHighlights(spalte);
    }

    function dragMove(clientX, clientY) {
        if (!drag.active || !drag.cardEl) return;
        drag.cardEl.style.left = (drag.startClientX + (clientX - drag.startX)) + 'px';
        drag.cardEl.style.top  = (drag.startClientY + (clientY - drag.startY)) + 'px';
        const hit = findSpalteAtPoint(clientX, clientY);
        updateHighlights(hit ? hit.spalte : null);
    }

    function dragEnd(clientX, clientY) {
        if (!drag.active) return;

        const card = board.cards.find(c => c.id === drag.cardId);
        if (card) {
            const hit = findSpalteAtPoint(clientX, clientY);
            const finalCardX = drag.startClientX + (clientX - drag.startX);
            const finalCardY = drag.startClientY + (clientY - drag.startY);

            if (hit) {
                const canvasEl = hit.el.querySelector('.karten-canvas');
                if (canvasEl) {
                    const cr = canvasEl.getBoundingClientRect();
                    positions[card.id] = {
                        x: Math.max(0, finalCardX - cr.left),
                        y: Math.max(20, finalCardY - cr.top)
                    };
                }
                if (hit.spalte !== card.spalte) {
                    card.spalte = hit.spalte;
                    wsSend({ type: 'kanban_card_move', cardId: card.id, spalte: hit.spalte,
                             x: positions[card.id]?.x, y: positions[card.id]?.y });
                    toast('Karte verschoben');
                }
            } else {
                positions[card.id] = { x: drag.startCardX, y: drag.startCardY };
            }
        }

        if (drag.cardEl && drag.cardEl.parentNode === document.body) drag.cardEl.remove();
        document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over', 'drag-target'));
        drag.active = false;
        drag.cardEl = null;
        dragSourceSpalte = null;
        renderBoard();
    }

    document.addEventListener('mousemove', e => { if (drag.active) dragMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup', e => { if (drag.active) dragEnd(e.clientX, e.clientY); });
    document.addEventListener('touchmove', e => {
        if (!drag.active) return;
        e.preventDefault();
        dragMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchend', e => {
        if (!drag.active) return;
        dragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    });
    document.addEventListener('touchcancel', () => {
        if (!drag.active) return;
        if (drag.cardEl) {
            if (drag.cardEl.parentNode === document.body) drag.cardEl.remove();
            else drag.cardEl.classList.remove('dragging');
        }
        document.querySelectorAll('.spalte').forEach(c => c.classList.remove('drag-over', 'drag-target'));
        drag.active = false; drag.cardEl = null; dragSourceSpalte = null;
        if (drag.cardId) positions[drag.cardId] = { x: drag.startCardX, y: drag.startCardY };
        renderBoard();
    });

    function karteHinzufuegen() {
        const textEl = document.getElementById('text');
        const autorEl = document.getElementById('autor');
        const spalteEl = document.getElementById('spalte-select');
        const text = textEl.value.trim();
        if (!text) { textEl.focus(); return; }
        const autor = autorEl.value.trim();
        const spalte = spalteEl.value || board.columns[0];
        if (autor) localStorage.setItem('kanban_autor', autor);
        const inSpalte = board.cards.filter(c => c.spalte === spalte);
        const idx = inSpalte.length;
        const cardX = 10 + (idx % 2) * (CARD_W + 15);
        const cardY = 20 + Math.floor(idx / 2) * (CARD_H + 15);
        wsSend({ type: 'kanban_card_add', text, autor, farbe: selectedFarbe, spalte, x: cardX, y: cardY });
        textEl.value = '';
        toast('Karte hinzugefügt ✓');
        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        setTimeout(() => btn.disabled = false, 800);
    }

    function karteLoeschen(cardId) {
        board.cards = board.cards.filter(c => c.id !== cardId);
        delete positions[cardId];
        renderBoard();
        wsSend({ type: 'kanban_card_delete', cardId });
        toast('Karte gelöscht');
    }

    function wsSend(data) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
    }

    document.getElementById('text').addEventListener('keyup', e => {
        if (e.key === 'Enter') karteHinzufuegen();
    });

    if (!session) show('view-error');
    else connect();

    function connect() {
        const wsUrl = 'wss://' + window.location.hostname + '/ws';
        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', role: 'student', sessionId: session }));
        };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'joined') {
                connected = true;
                document.getElementById('session-badge').textContent = 'Session ' + session;
                if (msg.kanbanBoard) board = msg.kanbanBoard;
                renderBoard();
                show('view-main');
            }
            if (msg.type === 'kanban_update') {
                const ids = new Set(msg.board.cards.map(c => c.id));
                Object.keys(positions).forEach(id => { if (!ids.has(id)) delete positions[id]; });
                board = msg.board;
                renderBoard();
            }
            if (msg.type === 'error') show('view-error');
            if (msg.type === 'session_ended') show('view-ended');
        };
        ws.onclose = () => { if (!connected) show('view-error'); else show('view-ended'); };
        ws.onerror = () => { if (!connected) show('view-error'); };
    }
</script>
